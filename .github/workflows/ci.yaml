name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff + pyright + pytest)
    runs-on: ubuntu-latest

    # If your tests require Postgres, uncomment this service block and set DATABASE_URL below.
    # services:
    #   postgres:
    #     image: postgres:16
    #     env:
    #       POSTGRES_USER: postgres
    #       POSTGRES_PASSWORD: postgres
    #       POSTGRES_DB: andromeda_test
    #     ports:
    #       - 5432:5432
    #     options: >-
    #       --health-cmd="pg_isready -U postgres"
    #       --health-interval=10s
    #       --health-timeout=5s
    #       --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Helpful for deps like WeasyPrint (runtime libs). Keep or remove depending on what breaks in CI.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libffi-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # Dev extras include ruff + pyright; test extras include pytest tooling.
          pip install -e ".[dev,test]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Pyright (typecheck)
        run: pyright

      - name: Pytest
        env:
          # If you enable Postgres service above, set this (or whatever your app expects)
          # DATABASE_URL: postgresql://postgres:postgres@localhost:5432/andromeda_test
          PYTHONUNBUFFERED: "1"
        run: pytest -vv tests/

  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run check:ts

      - name: Unit tests
        run: npm run test:unit

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npm run test:ui
